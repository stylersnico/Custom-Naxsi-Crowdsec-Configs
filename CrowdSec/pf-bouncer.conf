# Append to /etc/pf.conf, above any "pass" rules for the reverse-proxy's
# public interface - these tables must be evaluated before traffic is
# otherwise allowed through. Populated/maintained automatically by
# crowdsec-firewall-bouncer (mode: pf in its own config, see README).
table <crowdsec-blacklists> persist
table <crowdsec6-blacklists> persist
block drop in quick from <crowdsec-blacklists> to any
block drop in quick from <crowdsec6-blacklists> to any
