# Shared Naxsi "request denied" page.
# Include inside any server{} block that uses SecRulesEnabled - the
# global "DeniedUrl /naxsi_denied.html;" in nginx.conf targets this
# location on whichever vhost triggered the block.
#
# Served directly by the reverse proxy from a generic local folder -
# never proxied to a backend, not tied to any single site.

location = /naxsi_denied.html {
    internal;
    root /usr/local/etc/nginx/errors;
    default_type text/html;
}
