# Drop-in for /usr/local/etc/newsyslog.conf.d/ (auto-included by the
# default /etc/newsyslog.conf on FreeBSD - no other file needs editing).
#
# These access logs exist only to feed CrowdSec's detection scenarios
# (see ../../CrowdSec/acquis.yaml); they are not kept for analytics or
# audit. Rotated every hour with zero archives retained (count=0), so
# each file only ever holds up to ~1h of traffic before being wiped -
# "when" column "1" rotates on an hourly interval regardless of size.
# Signal 30 (SIGUSR1 on FreeBSD) tells nginx to reopen its log file
# handles without a full reload/restart.
#
# logfilename                                              owner:group mode count size when flags pidfile           signal
/var/log/nginx/abyssproject.net/access.log                 www:www     640  0     *    1    J     /var/run/nginx.pid 30
